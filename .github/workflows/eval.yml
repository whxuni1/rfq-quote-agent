name: eval

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CJK font used by labeled PDFs
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check src tests
      - name: Typecheck
        run: python -m mypy
      - name: Test
        run: python -m pytest
