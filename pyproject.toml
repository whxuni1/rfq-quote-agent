[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfq-quote-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rfq_agent = ["prompts/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 允许中文全角标点出现在字符串/注释中
    "UP042",                        # docs/02 规定枚举写作 (str, Enum)
]
