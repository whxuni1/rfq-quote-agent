[project]
name = "rfq-eval"
version = "0.1.0"
description = "Reproducible evaluation framework for the automotive RFQ quote agent."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "openpyxl>=3.1",
  "reportlab>=4.1",
  "pdfplumber>=0.11",
]

[project.scripts]
rfq-eval = "rfq_eval.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rfq_eval"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "reportlab", "reportlab.*", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
